name: AgriAI Deployment Readiness & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build, Validate & Test (Zero-Cost CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q app backend ml disease_detection storage

      - name: Verify Deployment Configuration Files
        run: |
          test -f app/Home.py || { echo "CRITICAL: app/Home.py entry point missing"; exit 1; }
          test -f .streamlit/config.toml || { echo "CRITICAL: .streamlit/config.toml missing"; exit 1; }
          test -f packages.txt || { echo "CRITICAL: packages.txt missing"; exit 1; }
          echo "All zero-cost deployment configuration files present and verified."

      - name: Run Automated Test Suite (48 Tests)
        run: |
          pytest tests -v
